services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lugemi-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: lugemi
      POSTGRES_PASSWORD: lugemi
      POSTGRES_DB: lugemi
    volumes:
      - lugemi_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lugemi -d lugemi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lugemi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - lugemi_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lugemi_pg_data:
  lugemi_redis_data:
