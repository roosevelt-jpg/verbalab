# Fly.io — Web Africa residency island (Johannesburg).
# Point NEXT_PUBLIC_API_URL at https://verbalab-api.fly.dev
# fly apps create verbalab-web
# fly deploy -c infra/fly/web.jnb.toml --dockerfile apps/web/Dockerfile \
#   --build-arg NEXT_PUBLIC_API_URL=https://verbalab-api.fly.dev
app = 'verbalab-web'
primary_region = 'jnb'

[build]
  dockerfile = 'apps/web/Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  LUGEMI_REGION = 'af'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '25s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
