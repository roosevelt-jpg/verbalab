# Default Fly app when launching from the Fly dashboard / GitHub (single app "verbalab").
# Prefer two apps for production: verbalab-api + verbalab-web — see docs/fly.md
#
# Public brand domain (≠ Fly app name):
#   Web  https://lugemi.com  (+ www → apex)
#   API  https://api.lugemi.com
#
# Deploy API (this config):
#   fly deploy -c fly.toml
# Deploy preferred pair:
#   fly deploy -c infra/fly/api.jnb.toml --dockerfile apps/api/Dockerfile
#   fly deploy -c infra/fly/web.jnb.toml --dockerfile apps/web/Dockerfile \
#     --build-arg NEXT_PUBLIC_API_URL=https://api.lugemi.com
#
# Custom domains (after DNS): fly certs add lugemi.com / api.lugemi.com — docs/fly.md
app = 'verbalab'
primary_region = 'jnb'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  # Soft-skips when DATABASE_URL unset; applies prisma migrate deploy when set.
  # See apps/api/scripts/fly-migrate.sh and docs/fly.md.
  release_command = '/bin/sh /app/apps/api/scripts/fly-migrate.sh'

[env]
  NODE_ENV = 'production'
  API_PORT = '3001'
  PORT = '3001'
  LUGEMI_REGION = 'af'
  APP_URL = 'https://lugemi.com'
  APP_PUBLIC_URL = 'https://lugemi.com'
  LUGEMI_API_URL_AF = 'https://api.lugemi.com'
  LUGEMI_WEB_URL_AF = 'https://lugemi.com'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
