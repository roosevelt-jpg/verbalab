# Fly.io — Web EU residency island (VL-075). Point NEXT_PUBLIC_API_URL at lugemi-api-eu.
# fly apps create lugemi-web-eu
# Do NOT deploy this config onto Africa primary app lugemi-web (jnb).
app = 'lugemi-web-eu'
primary_region = 'ams'

[build]
  # flyctl resolves this relative to this file's directory (infra/fly/).
  dockerfile = '../../apps/web/Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  HOSTNAME = '0.0.0.0'
  LUGEMI_REGION = 'eu'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '60s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
