services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: verbalab-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: verbalab
      POSTGRES_PASSWORD: verbalab
      POSTGRES_DB: verbalab
    volumes:
      - verbalab_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verbalab -d verbalab"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: verbalab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - verbalab_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  verbalab_pg_data:
  verbalab_redis_data:
