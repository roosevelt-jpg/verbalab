# lugemi-api (Nest) — Africa-first primary region Johannesburg.
# Deploy from repo root (build context = monorepo root):
#   fly deploy -c apps/api/fly.toml --dockerfile apps/api/Dockerfile
# Existing Fly app verbalab-api: fly apps rename verbalab-api lugemi-api (or create lugemi-api).
# Custom domain: fly certs add api.lugemi.com -a lugemi-api
app = 'lugemi-api'
primary_region = 'jnb'

[build]
  # Overridden by --dockerfile when deploying from repo root (required for pnpm workspace COPY).
  dockerfile = 'apps/api/Dockerfile'

[deploy]
  # Soft-skips when DATABASE_URL unset; applies prisma migrate deploy when set.
  release_command = '/bin/sh /app/apps/api/scripts/fly-migrate.sh'

[env]
  NODE_ENV = 'production'
  API_PORT = '3001'
  PORT = '3001'
  HOST = '0.0.0.0'
  LUGEMI_REGION = 'af'
  # Resend From (domain must be verified in Resend). Secret: RESEND_API_KEY via fly secrets.
  EMAIL_FROM = 'Lugemi <noreply@lugemi.com>'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    # Nest maps many routes before listen; short grace races Fly Doctor "not listening".
    grace_period = '60s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
