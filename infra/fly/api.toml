# Fly.io — API (Nest). Create with: fly apps create lugemi-api
# Deploy from repo root: fly deploy -c infra/fly/api.toml --dockerfile apps/api/Dockerfile
app = 'lugemi-api'
primary_region = 'iad'

[build]
  dockerfile = 'apps/api/Dockerfile'

[deploy]
  # Soft-skips when DATABASE_URL unset; applies prisma migrate deploy when set.
  release_command = '/bin/sh /app/apps/api/scripts/fly-migrate.sh'

[env]
  NODE_ENV = 'production'
  API_PORT = '3001'
  PORT = '3001'
  LUGEMI_REGION = 'us'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
