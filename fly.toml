# fly.toml app configuration file generated for verbalab on 2026-10-06T18:55:46Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'verbalab'
primary_region = 'jnb'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = '/bin/sh /app/apps/api/scripts/fly-migrate.sh'

[env]
  API_PORT = '3001'
  LUGEMI_REGION = 'af'
  NODE_ENV = 'production'
  PORT = '3001'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '45s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
