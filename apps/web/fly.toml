# verbalab-web (Next.js) — Africa-first primary region Johannesburg.
# Fly app name ≠ public hostname. Public web: https://lugemi.com
# Deploy from repo root (build context = monorepo root):
#   fly deploy -c apps/web/fly.toml --dockerfile apps/web/Dockerfile \
#     --build-arg NEXT_PUBLIC_API_URL=https://api.lugemi.com \
#     --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_...
# Custom domain: fly certs add lugemi.com -a verbalab-web && fly certs add www.lugemi.com -a verbalab-web
app = 'verbalab-web'
primary_region = 'jnb'

[build]
  # Overridden by --dockerfile when deploying from repo root (required for pnpm workspace COPY).
  dockerfile = 'apps/web/Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  LUGEMI_REGION = 'af'
  APP_URL = 'https://lugemi.com'
  NEXT_PUBLIC_APP_URL = 'https://lugemi.com'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '25s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
