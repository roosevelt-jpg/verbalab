# Requires an Ingress controller (AWS Load Balancer Controller recommended on EKS).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: verbalab
  namespace: verbalab
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
spec:
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: verbalab-api
                port:
                  number: 80
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: verbalab-web
                port:
                  number: 80
