# Fly.io — Web (Next). Create with: fly apps create lugemi-web
# Deploy from repo root: fly deploy -c infra/fly/web.toml --dockerfile apps/web/Dockerfile
app = 'lugemi-web'
primary_region = 'iad'

[build]
  dockerfile = 'apps/web/Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  LUGEMI_REGION = 'us'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
