apiVersion: apps/v1
kind: Deployment
metadata:
  name: lugemi-api
  namespace: lugemi
  labels:
    app: lugemi-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lugemi-api
  template:
    metadata:
      labels:
        app: lugemi-api
    spec:
      containers:
        - name: api
          image: REPLACE_ECR_OR_REGISTRY/lugemi-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: lugemi-config
            - secretRef:
                name: lugemi-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: lugemi-api-migrate
  namespace: lugemi
  labels:
    app: lugemi-api-migrate
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: REPLACE_ECR_OR_REGISTRY/lugemi-api:latest
          command: ["pnpm", "--filter", "@lugemi/api", "exec", "prisma", "migrate", "deploy"]
          envFrom:
            - secretRef:
                name: lugemi-secrets
