# Default Fly app when launching from the Fly dashboard / GitHub (single app "lugemi").
# Prefer two apps for production: lugemi-api + lugemi-web — see docs/fly.md
#
# If an existing Fly app is still named verbalab / verbalab-api / verbalab-web:
#   fly apps rename verbalab lugemi
#   fly apps rename verbalab-api lugemi-api
#   fly apps rename verbalab-web lugemi-web
# Or create new lugemi* apps and update DNS/certs — do not break an in-flight deploy.
#
# Deploy API (this config):
#   fly deploy -c fly.toml
# Deploy preferred pair:
#   fly deploy -c infra/fly/api.jnb.toml --dockerfile apps/api/Dockerfile
#   fly deploy -c infra/fly/web.jnb.toml --dockerfile apps/web/Dockerfile \
#     --build-arg NEXT_PUBLIC_API_URL=https://api.lugemi.com
app = 'lugemi'
primary_region = 'jnb'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  # Soft-skips when DATABASE_URL unset; applies prisma migrate deploy when set.
  # See apps/api/scripts/fly-migrate.sh and docs/fly.md.
  release_command = '/bin/sh /app/apps/api/scripts/fly-migrate.sh'

[env]
  NODE_ENV = 'production'
  API_PORT = '3001'
  PORT = '3001'
  LUGEMI_REGION = 'af'
  # Resend From (domain must be verified in Resend). Secret: RESEND_API_KEY via fly secrets.
  EMAIL_FROM = 'Lugemi <noreply@lugemi.com>'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '45s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
